<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ room_title }}</title><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root{color-scheme:dark;--line:#263b58;--muted:#91a6c2;--blue:#3478f6;--green:#22c58b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172b49 0,#080f1d 58%);color:#edf4ff;font:15px Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
button,input{font:inherit}button{border:0;border-radius:12px;background:var(--blue);color:white;padding:12px 16px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#263a56}.danger{background:#a83249}.ghost{background:transparent;border:1px solid var(--line)}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0a1526;color:white;outline:none}input:focus{border-color:#5791ff}
.shell{width:min(1100px,100%);height:min(900px,94vh);min-height:570px;border:1px solid var(--line);border-radius:24px;background:#101b2d;box-shadow:0 24px 90px #0008;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#3478f6,#6a55d9);display:grid;place-items:center;font-weight:900}.title{font-size:18px;font-weight:850}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:none;align-items:center;gap:8px;flex-wrap:wrap}.online{color:#70e4b8;font-size:13px}.online:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px}
#auth{width:min(420px,calc(100% - 32px));margin:auto;display:grid;gap:12px;padding:26px 0}#auth h2{margin:0 0 4px;font-size:25px}.note{color:var(--muted);font-size:13px;line-height:1.5}.auth-actions{display:flex;gap:9px}.auth-actions button{flex:1}.err{color:#ff9eae;min-height:18px;font-size:13px}
#chat{display:none;flex:1;min-height:0;flex-direction:column}.toolbar{padding:10px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #1e304a;color:var(--muted);font-size:13px}.feed{flex:1;min-height:0;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.empty{text-align:center;color:var(--muted);margin:auto}.msg-row{display:flex;gap:9px;align-items:flex-end;max-width:82%}.msg-row.mine{align-self:flex-end;flex-direction:row-reverse}.avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#31496b;font-size:12px;font-weight:800}.bubble{padding:10px 13px;border-radius:17px 17px 17px 5px;background:#1d2d45;min-width:90px;overflow-wrap:anywhere;box-shadow:0 4px 12px #0002}.mine .bubble{background:linear-gradient(135deg,#205aa6,#285fc0);border-radius:17px 17px 5px 17px}.msg-name{font-size:11px;font-weight:800;color:#9fc5ff;margin-bottom:4px}.msg-text{white-space:pre-wrap;line-height:1.45}.msg-time{font-size:10px;color:#b5c6dc;margin-top:6px;text-align:right}.composer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px}.composer input{flex:1;min-width:0}
#videoPanel{display:none;padding:12px 18px;background:#0b1423;border-top:1px solid var(--line)}.video-head{display:flex;justify-content:space-between;margin-bottom:10px}.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.tile{position:relative;min-height:130px;background:#02060c;border-radius:14px;overflow:hidden}.tile video{width:100%;height:100%;min-height:130px;object-fit:cover}.label{position:absolute;left:10px;bottom:8px;background:#0009;padding:4px 8px;border-radius:8px;font-size:11px}.pop{display:none;position:absolute;right:18px;top:76px;background:#1a2b43;border:1px solid var(--line);padding:14px;border-radius:14px;z-index:5;width:230px}.pop button{width:100%;margin-top:8px}
@media(max-width:640px){body{padding:0}.shell{height:100dvh;min-height:0;border-radius:0;border:0}.top{padding:13px}.actions button{padding:9px 11px;font-size:12px}.title{font-size:16px}.feed{padding:14px}.msg-row{max-width:94%}.composer{padding:10px}.toolbar{padding:9px 13px}.pop{right:10px;top:68px}}
</style></head><body><main class="shell">
<header class="top"><div class="brand"><div class="logo">SR</div><div><div class="title">{{ room_title }}</div><div class="sub" id="status">Private community chat</div></div></div>
<div class="actions" id="actions"><span class="online" id="active">0 active</span><button class="secondary" id="videoBtn">Group video call</button><button class="ghost" id="accountBtn">Account ▾</button></div></header>
<div class="pop" id="pop"><b id="myName"></b><div class="note" id="myUser"></div><button class="secondary" id="logoutBtn">Logout</button><button class="danger" id="deleteBtn">Delete account</button></div>
<section id="auth"><h2 id="authTitle">Welcome back 👋</h2><div class="note" id="authDesc">Login with your username and password.</div>
<input id="name" placeholder="Your full name" autocomplete="name" style="display:none"><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password">
<div class="auth-actions"><button id="submitBtn">Login</button><button class="secondary" id="toggleBtn">Create account</button></div><div class="err" id="authError"></div></section>
<section id="chat"><div class="toolbar"><span id="feedLabel">Messages</span><span>Saved chat history</span></div><div class="feed" id="feed"><div class="empty">No messages yet. Say hello 👋</div></div>
<div id="videoPanel"><div class="video-head"><b>Group video call</b><button class="danger" id="leaveVideoBtn">Leave call</button></div><div class="video-grid" id="videoGrid"></div><div class="note" id="videoStatus">Camera/microphone required.</div></div>
<form class="composer" id="sendForm"><input id="messageInput" maxlength="2000" placeholder="Write a message…" autocomplete="off"><button>Send</button></form></section>
</main><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('sr_chat_token')||'',me=null,sock=null,registerMode=false,seen=new Set(),localStream=null,pcs={};
const rtcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function showError(s){$('authError').textContent=s||''}
async function post(path,data){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function addMessage(m){if(seen.has(m.id))return;seen.add(m.id);$('feed').querySelector('.empty')?.remove();const row=document.createElement('div');row.className='msg-row'+(m.uid===me?.id?' mine':'');const av=document.createElement('div');av.className='avatar';av.textContent=(m.name||m.username||'U').trim().slice(0,1).toUpperCase();const b=document.createElement('div');b.className='bubble';const n=document.createElement('div');n.className='msg-name';n.textContent=m.uid===me?.id?'You':(m.name||m.username);const t=document.createElement('div');t.className='msg-text';t.textContent=m.text||'';const tm=document.createElement('div');tm.className='msg-time';tm.textContent=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});b.append(n,t,tm);row.append(av,b);$('feed').append(row);$('feed').scrollTop=$('feed').scrollHeight}
function setMode(reg){registerMode=reg;$('authTitle').textContent=reg?'Create your account':'Welcome back 👋';$('authDesc').textContent=reg?'Enter your name, unique username and password.':'Login with your username and password.';$('name').style.display=reg?'block':'none';$('submitBtn').textContent=reg?'Create account':'Login';$('toggleBtn').textContent=reg?'Back to login':'Create account';showError('')}
function enter(data){token=data.token;me=data.me;localStorage.setItem('sr_chat_token',token);$('auth').style.display='none';$('chat').style.display='flex';$('actions').style.display='flex';$('myName').textContent=me.name;$('myUser').textContent='@'+me.username;$('status').textContent='Connected · '+me.name;sock=io({auth:{token}});sock.on('connect',()=>$('status').textContent='Connected · '+me.name);sock.on('disconnect',()=>$('status').textContent='Reconnecting…');sock.on('chat_history',d=>(d.messages||[]).forEach(addMessage));sock.on('new_message',addMessage);sock.on('chat_error',d=>alert(d.error));sock.on('presence_update',d=>{$('active').textContent=(d.count||0)+' active';$('feedLabel').textContent=(d.count||0)+' people online'});sock.on('video_peers',async d=>{for(const sid of (d.peers||[]))await makeOffer(sid)});sock.on('video_peer_joined',d=>makeOffer(d.sid));sock.on('video_peer_left',d=>removePeer(d.sid));sock.on('webrtc_signal',handleSignal)}
$('toggleBtn').onclick=()=>setMode(!registerMode);$('submitBtn').onclick=async()=>{try{showError('');$('submitBtn').disabled=true;const data=registerMode?{name:$('name').value,username:$('username').value,password:$('password').value}:{username:$('username').value,password:$('password').value};enter(await post(registerMode?'register':'login',data))}catch(e){showError(e.message)}finally{$('submitBtn').disabled=false}};
$('sendForm').onsubmit=e=>{e.preventDefault();const text=$('messageInput').value.trim();if(text&&sock?.connected){sock.emit('send_message',{text});$('messageInput').value=''}};
$('accountBtn').onclick=()=>$('pop').style.display=$('pop').style.display==='block'?'none':'block';
function cleanup(){if(sock){sock.emit('leave_video');sock.disconnect()}Object.values(pcs).forEach(p=>p.close());pcs={};if(localStream)localStream.getTracks().forEach(t=>t.stop())}
$('logoutBtn').onclick=async()=>{try{await post('logout',{token})}finally{cleanup();localStorage.removeItem('sr_chat_token');location.reload()}};
$('deleteBtn').onclick=async()=>{const password=prompt('Enter your password to permanently delete your account:');if(password===null)return;if(!confirm('Delete your account AND all your old messages? This cannot be undone.'))return;try{await post('delete-account',{token,password});cleanup();localStorage.removeItem('sr_chat_token');alert('Account and its messages deleted.');location.reload()}catch(e){alert(e.message)}};
function addVideoTile(id,media,label,muted=false){if($('tile-'+id))return;const tile=document.createElement('div');tile.className='tile';tile.id='tile-'+id;const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=muted;v.srcObject=media;const l=document.createElement('span');l.className='label';l.textContent=label;tile.append(v,l);$('videoGrid').append(tile)}
async function startVideo(){try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('videoPanel').style.display='block';$('videoBtn').disabled=true;$('videoStatus').textContent='Camera ready. Joining group call…';addVideoTile('local',localStream,'You',true);sock.emit('join_video')}catch(e){alert('Camera/microphone permission failed: '+e.message)}}
function makePeer(sid){if(pcs[sid])return pcs[sid];const pc=new RTCPeerConnection(rtcConfig);pcs[sid]=pc;if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)sock.emit('webrtc_signal',{to:sid,kind:'ice',payload:e.candidate})};pc.ontrack=e=>addVideoTile(sid,e.streams[0],'Participant');pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))removePeer(sid)};return pc}
async function makeOffer(sid){if(!localStream||!sid||pcs[sid])return;const pc=makePeer(sid);const offer=await pc.createOffer();await pc.setLocalDescription(offer);sock.emit('webrtc_signal',{to:sid,kind:'offer',payload:pc.localDescription})}
async function handleSignal(d){try{const pc=makePeer(d.from);if(d.kind==='offer'){await pc.setRemoteDescription(d.payload);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);sock.emit('webrtc_signal',{to:d.from,kind:'answer',payload:pc.localDescription})}else if(d.kind==='answer')await pc.setRemoteDescription(d.payload);else if(d.kind==='ice'&&d.payload)await pc.addIceCandidate(d.payload)}catch(e){console.warn('WebRTC error',e)}}
function removePeer(sid){pcs[sid]?.close();delete pcs[sid];$('tile-'+sid)?.remove()}
$('videoBtn').onclick=startVideo;$('leaveVideoBtn').onclick=()=>{sock.emit('leave_video');Object.keys(pcs).forEach(removePeer);if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;$('tile-local')?.remove();$('videoPanel').style.display='none';$('videoBtn').disabled=false};
window.addEventListener('beforeunload',cleanup);
(async()=>{if(!token)return;try{const d=await post('me',{token});enter({token,me:d.me})}catch(e){localStorage.removeItem('sr_chat_token')}})();
</script></body></html>
